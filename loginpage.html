<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medivance - Doctor-Patient Management System</title>
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
            'card': '0 20px 50px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03)',
            'glow-blue': '0 0 20px rgba(37, 99, 235, 0.35)',
            'glow-teal': '0 0 20px rgba(13, 148, 136, 0.35)',
            'glow-purple': '0 0 20px rgba(124, 58, 237, 0.35)',
          },
          animation: {
            'float-slow': 'float 6s ease-in-out infinite',
            'pulse-subtle': 'pulseSubtle 3s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: 1 },
              '50%': { opacity: 0.7 },
            }
          }
        }
      }
    }
  </script>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- React and ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICON COMPONENTS ---
    const StethoscopeIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.5 12.75l6 6 9-13.5" />
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" />
      </svg>
    );

    const UserIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    );

    const UserCheckIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    );

    const EyeIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
    );

    const EyeOffIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 013.122-.563c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
      </svg>
    );

    const GoogleIcon = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
    );

    const AppleIcon = ({ className = "w-5 h-5" }) => (
      <svg className={`${className} fill-current`} viewBox="0 0 24 24">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.13-1.96.99-3.12-1 .04-2.21.67-2.92 1.49-.64.74-1.2 1.92-1.05 3.06 1.12.09 2.26-.56 2.98-1.43z"/>
      </svg>
    );

    // --- STRAIGHT / UPRIGHT MEDIVANCE LOGO ---
    const MedivanceLogo = ({ className = "w-8 h-8" }) => (
      <div className="flex items-center justify-center p-1.5 rounded-xl bg-white shadow-md border border-slate-200/80 shrink-0">
        <svg className={className} viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="medivanceBlue" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#0052D4" />
              <stop offset="100%" stopColor="#1E88E5" />
            </linearGradient>
            <linearGradient id="medivanceTeal" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#00ACC1" />
              <stop offset="100%" stopColor="#00E5FF" />
            </linearGradient>
            <linearGradient id="crossGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stopColor="#00E5FF" />
              <stop offset="100%" stopColor="#00838F" />
            </linearGradient>
          </defs>

          {/* Top Medical Cross */}
          <path d="M100 8 V48 M80 28 H120" stroke="url(#crossGradient)" strokeWidth="14" strokeLinecap="round" />

          {/* Upright 'M' Left Wing (Royal Blue Gradient) */}
          <path d="M28 140 V50 C28 38, 38 32, 48 32 C58 32, 65 38, 75 52 L100 90 L102 90" fill="none" stroke="url(#medivanceBlue)" strokeWidth="22" strokeLinecap="round" strokeLinejoin="round" />

          {/* Upright 'M' Right Wing (Teal Gradient) */}
          <path d="M172 140 V50 C172 38, 162 32, 152 32 C142 32, 135 38, 125 52 L100 90 L98 90" fill="none" stroke="url(#medivanceTeal)" strokeWidth="22" strokeLinecap="round" strokeLinejoin="round" />

          {/* Horizontal EKG Pulse Line across center */}
          <path d="M15 95 H68 L78 82 L88 112 L98 70 L108 105 L118 90 L128 95 H185" stroke="#FFFFFF" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </div>
    );

    // --- 3D BACKGROUND COMPONENT USING THREE.JS ---
    const Scene3D = ({ activeRole }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

        const camera = new THREE.PerspectiveCamera(
          45,
          container.clientWidth / container.clientHeight,
          0.1,
          100
        );
        camera.position.set(0, 0, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x2563eb, 3, 20);
        pointLight.position.set(0, 0, 5);
        scene.add(pointLight);

        const createCrossMesh = () => {
          const group = new THREE.Group();
          const mat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.2,
            transmission: 0.8,
            thickness: 1.2,
            clearcoat: 1,
            clearcoatRoughness: 0.1,
            ior: 1.5,
          });

          const box1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.4, 0.8), mat);
          const box2 = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.8, 0.8), mat);
          group.add(box1);
          group.add(box2);
          return group;
        };

        const crossObj = createCrossMesh();
        crossObj.position.set(-3.5, 2, 0);
        mainGroup.add(crossObj);

        const createPillMesh = () => {
          const group = new THREE.Group();
          const capGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.4, 32);
          
          const topMat = new THREE.MeshStandardMaterial({
            color: 0x3b82f6,
            roughness: 0.2,
            metalness: 0.3,
          });
          const botMat = new THREE.MeshPhysicalMaterial({
            color: 0xf8fafc,
            roughness: 0.1,
            transmission: 0.9,
            thickness: 0.5,
          });

          const topMesh = new THREE.Mesh(capGeo, topMat);
          topMesh.position.y = 0.7;

          const sphereTop = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), topMat);
          sphereTop.position.y = 1.4;

          const sphereBot = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), botMat);
          sphereBot.position.y = 0;

          group.add(topMesh);
          group.add(sphereTop);
          group.add(sphereBot);
          group.rotation.z = Math.PI / 4;
          return group;
        };

        const pillObj = createPillMesh();
        pillObj.position.set(3.5, -2, 1);
        mainGroup.add(pillObj);

        const createDnaMesh = () => {
          const dnaGroup = new THREE.Group();
          const sphereGeo = new THREE.SphereGeometry(0.2, 16, 16);
          const mat1 = new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.3 });
          const mat2 = new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.3 });
          const lineMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.5 });

          const count = 12;
          for (let i = 0; i < count; i++) {
            const y = (i - count / 2) * 0.45;
            const angle = i * 0.5;
            const radius = 1.2;

            const x1 = Math.cos(angle) * radius;
            const z1 = Math.sin(angle) * radius;

            const x2 = Math.cos(angle + Math.PI) * radius;
            const z2 = Math.sin(angle + Math.PI) * radius;

            const s1 = new THREE.Mesh(sphereGeo, mat1);
            s1.position.set(x1, y, z1);

            const s2 = new THREE.Mesh(sphereGeo, mat2);
            s2.position.set(x2, y, z2);

            const dist = s1.position.distanceTo(s2.position);
            const rodGeo = new THREE.CylinderGeometry(0.04, 0.04, dist, 8);
            const rod = new THREE.Mesh(rodGeo, lineMat);
            rod.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
            rod.rotation.z = Math.PI / 2;
            rod.rotation.y = -angle;

            dnaGroup.add(s1);
            dnaGroup.add(s2);
            dnaGroup.add(rod);
          }
          return dnaGroup;
        };

        const dnaObj = createDnaMesh();
        dnaObj.position.set(-2.5, -2.5, -1);
        dnaObj.rotation.x = 0.3;
        mainGroup.add(dnaObj);

        const torusMat = new THREE.MeshPhysicalMaterial({
          color: 0x0d9488,
          roughness: 0.1,
          metalness: 0.2,
          transmission: 0.6,
          thickness: 0.8
        });
        const torusKnot = new THREE.Mesh(
          new THREE.TorusKnotGeometry(1.2, 0.25, 100, 16),
          torusMat
        );
        torusKnot.position.set(3, 2.5, -2);
        mainGroup.add(torusKnot);

        const particlesCount = 40;
        const particleGeo = new THREE.OctahedronGeometry(0.15, 0);
        const particleMat = new THREE.MeshStandardMaterial({
          color: 0x38bdf8,
          roughness: 0.4,
          transparent: true,
          opacity: 0.8
        });
        const particlesGroup = new THREE.Group();

        for (let i = 0; i < particlesCount; i++) {
          const p = new THREE.Mesh(particleGeo, particleMat);
          p.position.set(
            (Math.random() - 0.5) * 16,
            (Math.random() - 0.5) * 16,
            (Math.random() - 0.5) * 10
          );
          p.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
          p.userData = {
            speedY: 0.003 + Math.random() * 0.005,
            rotSpeed: 0.005 + Math.random() * 0.01
          };
          particlesGroup.add(p);
        }
        mainGroup.add(particlesGroup);

        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const handleMouseMove = (e) => {
          const rect = container.getBoundingClientRect();
          mouseX = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
          mouseY = -(((e.clientY - rect.top) / container.clientHeight) * 2 - 1);
        };

        window.addEventListener('mousemove', handleMouseMove);

        const handleResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        let animationFrameId;
        let clock = new THREE.Clock();

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();

          crossObj.rotation.x = Math.sin(elapsedTime * 0.5) * 0.3;
          crossObj.rotation.y += 0.008;

          pillObj.rotation.y += 0.006;
          pillObj.rotation.x = Math.cos(elapsedTime * 0.4) * 0.2;

          dnaObj.rotation.y += 0.01;

          torusKnot.rotation.x += 0.005;
          torusKnot.rotation.y += 0.007;

          crossObj.position.y = 2 + Math.sin(elapsedTime * 1.2) * 0.25;
          pillObj.position.y = -2 + Math.cos(elapsedTime * 1.5) * 0.25;
          dnaObj.position.y = -2.5 + Math.sin(elapsedTime * 0.9) * 0.2;
          torusKnot.position.y = 2.5 + Math.cos(elapsedTime * 1.1) * 0.2;

          particlesGroup.children.forEach(p => {
            p.position.y += p.userData.speedY;
            p.rotation.x += p.userData.rotSpeed;
            p.rotation.y += p.userData.rotSpeed;

            if (p.position.y > 8) p.position.y = -8;
          });

          targetX += (mouseX - targetX) * 0.05;
          targetY += (mouseY - targetY) * 0.05;

          mainGroup.rotation.y = targetX * 0.25;
          mainGroup.rotation.x = -targetY * 0.25;

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return (
        <div className="relative w-full h-full min-h-[300px] lg:min-h-full overflow-hidden bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex flex-col justify-between p-8 lg:p-12">
          <div className={`absolute -top-24 -left-24 w-96 h-96 rounded-full blur-3xl opacity-30 transition-colors duration-700 ${
            activeRole === 'doctor' ? 'bg-blue-500' : activeRole === 'patient' ? 'bg-teal-500' : 'bg-purple-500'
          }`}></div>
          <div className="absolute -bottom-24 -right-24 w-96 h-96 bg-cyan-500 rounded-full blur-3xl opacity-20"></div>

          <div ref={containerRef} className="absolute inset-0 z-0"></div>

          <div className="relative z-10 flex items-center gap-3">
            <MedivanceLogo className="w-8 h-8" />
            <div>
              <span className="text-xl font-bold tracking-tight text-white">Medivance</span>
              <span className="block text-xs font-medium text-slate-400">Enterprise Health Platform</span>
            </div>
          </div>

          <div className="relative z-10 mt-auto max-w-md backdrop-blur-xl bg-white/10 p-6 rounded-2xl border border-white/15 shadow-2xl text-white">
            <div className="flex items-center gap-2 mb-3">
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-white/20 text-white border border-white/30 backdrop-blur-md">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                HIPAA Compliant & Encrypted
              </span>
            </div>
            <h2 className="text-2xl font-bold leading-snug tracking-tight text-white mb-2">
              Next-Generation Clinical & Patient Care
            </h2>
            <p className="text-sm text-slate-300 leading-relaxed">
              Streamline appointments, access real-time patient telemetry, and collaborate effortlessly across departments.
            </p>

            <div className="mt-6 flex items-center gap-4 text-xs text-slate-300 border-t border-white/10 pt-4">
              <div className="flex -space-x-2">
                <div className="w-7 h-7 rounded-full bg-blue-500 border-2 border-slate-900 flex items-center justify-center font-bold text-[10px]">MD</div>
                <div className="w-7 h-7 rounded-full bg-teal-500 border-2 border-slate-900 flex items-center justify-center font-bold text-[10px]">PT</div>
                <div className="w-7 h-7 rounded-full bg-purple-500 border-2 border-slate-900 flex items-center justify-center font-bold text-[10px]">AS</div>
              </div>
              <span>Trusted by 5,000+ certified healthcare providers</span>
            </div>
          </div>
        </div>
      );
    };

    // --- FORGOT PASSWORD MODAL ---
    const ForgotPasswordModal = ({ isOpen, onClose, activeRole }) => {
      const [email, setEmail] = useState('');
      const [submitted, setSubmitted] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (email) {
          setSubmitted(true);
        }
      };

      const handleReset = () => {
        setSubmitted(false);
        setEmail('');
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-md w-full p-6 sm:p-8 relative">
            <button 
              onClick={handleReset}
              className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors"
            >
              ✕
            </button>

            {!submitted ? (
              <form onSubmit={handleSubmit} className="space-y-4">
                <div className="text-center sm:text-left">
                  <div className="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mb-3 mx-auto sm:mx-0">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                  </div>
                  <h3 className="text-xl font-bold text-slate-900">Reset Password</h3>
                  <p className="text-sm text-slate-500 mt-1">
                    Enter your registered email address and we'll send you instructions to reset your account password.
                  </p>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                  <input
                    type="email"
                    required
                    placeholder="doctor@hospital.org"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm transition-all"
                  />
                </div>

                <div className="flex gap-3 pt-2">
                  <button
                    type="button"
                    onClick={handleReset}
                    className="w-1/2 py-2.5 px-4 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50 transition-colors"
                  >

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Phone</label>
                      <div className={`flex items-center rounded-xl border ${errors.phone ? 'border-red-400 bg-red-50/20' : 'border-slate-200'} overflow-hidden focus-within:ring-2 ${currentTheme.ringAccent}`}>
                        <span className="bg-slate-100 text-slate-600 font-semibold px-3 py-2.5 text-sm border-r border-slate-200 select-none">
                          +91
                        </span>
                        <input
                          type="tel"
                          placeholder="9876543210"
                          maxLength={10}
                          value={signUpData.phone}
                          onChange={handlePhoneChange}
                          className="w-full px-3.5 py-2.5 focus:outline-none text-sm transition-all bg-transparent"
                        />
                      </div>
                      {errors.phone && <p className="text-xs text-red-500 mt-1 font-medium">{errors.phone}</p>}
                    </div>
                  </div>

                  {currentTheme.roleFieldLabel && (
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        {currentTheme.roleFieldLabel}
                      </label>
                      <input
                        type="text"
                        placeholder={currentTheme.roleFieldPlaceholder}
                        value={signUpData.roleSpecific}
                        onChange={(e) => setSignUpData({ ...signUpData, roleSpecific: e.target.value })}
                        className={`w-full px-4 py-2.5 rounded-xl border ${errors.roleSpecific ? 'border-red-400 bg-red-50/20' : 'border-slate-200'} focus:outline-none focus:ring-2 ${currentTheme.ringAccent} text-sm transition-all`}
                      />
                      {errors.roleSpecific && <p className="text-xs text-red-500 mt-1 font-medium">{errors.roleSpecific}</p>}
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                      <div className="relative">
                        <input
                          type={showPassword ? 'text' : 'password'}
                          placeholder="••••••••"
                          value={signUpData.password}
                          onChange={(e) => setSignUpData({ ...signUpData, password: e.target.value })}
                          className={`w-full px-3.5 py-2.5 pr-8 rounded-xl border ${errors.password ? 'border-red-400 bg-red-50/20' : 'border-slate-200'} focus:outline-none focus:ring-2 ${currentTheme.ringAccent} text-sm transition-all`}
                        />
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-0.5"
                        >
                          {showPassword ? <EyeOffIcon className="w-4 h-4" /> : <EyeIcon className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Confirm</label>
                      <div className="relative">
                        <input
                          type={showConfirmPassword ? 'text' : 'password'}
                          placeholder="••••••••"
                          value={signUpData.confirmPassword}
                          onChange={(e) => setSignUpData({ ...signUpData, confirmPassword: e.target.value })}
                          className={`w-full px-3.5 py-2.5 pr-8 rounded-xl border ${errors.confirmPassword ? 'border-red-400 bg-red-50/20' : 'border-slate-200'} focus:outline-none focus:ring-2 ${currentTheme.ringAccent} text-sm transition-all`}
                        />
                        <button
                          type="button"
                          onClick={() => setShowConfirmPassword(!showConfirmPassword)}
                          className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-0.5"
                        >
                          {showConfirmPassword ? <EyeOffIcon className="w-4 h-4" /> : <EyeIcon className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>
                  </div>
                  {errors.confirmPassword && <p className="text-xs text-red-500 font-medium">{errors.confirmPassword}</p>}

                  <div className="pt-1">
                    <label className="flex items-start gap-2.5 cursor-pointer group">
                      <input
                        type="checkbox"
                        checked={agreeTerms}
                        onChange={(e) => setAgreeTerms(e.target.checked)}
                        className={`mt-0.5 w-4 h-4 rounded border-slate-300 ${currentTheme.accentColor} focus:ring-2 ${currentTheme.ringAccent} transition-all`}
                      />
                      <span className="text-xs text-slate-600 group-hover:text-slate-800 leading-snug">
                        I agree to the <a href="#" className="underline font-semibold">Terms of Service</a> and <a href="#" className="underline font-semibold">HIPAA Privacy Policy</a>
                      </span>
                    </label>
                    {errors.agreeTerms && <p className="text-xs text-red-500 mt-1 font-medium">{errors.agreeTerms}</p>}
                  </div>

                  <button
                    type="submit"
                    className={`w-full py-3.5 px-4 rounded-xl text-white font-semibold text-sm transition-all transform active:scale-[0.98] mt-2 ${currentTheme.buttonGradient}`}
                  >
                    Register as {role.toUpperCase()}
                  </button>

                  <p className="text-center text-xs text-slate-500 pt-2">
                    Already have an account?{' '}
                    <button
                      type="button"
                      onClick={() => { setAuthTab('signin'); setErrors({}); }}
                      className={`font-semibold ${currentTheme.accentColor} hover:underline`}
                    >
                      Sign in
                    </button>
                  </p>
                </form>
              )}

            </div>
          </div>

          {ssoModalData && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-100 flex flex-col gap-5 relative">
                <button 
                  type="button" 
                  onClick={() => setSsoModalData(null)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 p-1 text-lg font-bold"
                >
                  &times;
                </button>

                <div className="flex items-center gap-3">
                  <div className={`w-12 h-12 rounded-2xl flex items-center justify-center ${ssoModalData.provider === 'Google' ? 'bg-blue-50 text-blue-600' : 'bg-slate-100 text-slate-900'}`}>
                    {ssoModalData.provider === 'Google' ? <GoogleIcon className="w-6 h-6" /> : <AppleIcon className="w-6 h-6" />}
                  </div>
                  <div>
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Single Sign-On Consent</span>
                    <h3 className="text-lg font-bold text-slate-900">{ssoModalData.provider} Account Login</h3>
                  </div>
                </div>

                <div className="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 space-y-2 text-xs text-slate-600">
                  <div className="flex justify-between items-center">
                    <span className="font-semibold text-slate-500">Account Email:</span>
                    <span className="font-bold text-slate-800">{ssoModalData.email}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="font-semibold text-slate-500">Target Workspace:</span>
                    <span className={`font-bold ${currentTheme.accentColor}`}>{currentTheme.name}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="font-semibold text-slate-500">Data Protection:</span>
                    <span className="font-bold text-emerald-600">HIPAA Compliant (TLS 1.3)</span>
                  </div>
                </div>

                <div className="bg-blue-50/70 border border-blue-200 rounded-xl p-3 text-xs text-blue-900 flex gap-2.5 items-start">
                  <i className="fa-solid fa-shield-halved text-blue-600 text-sm mt-0.5"></i>
                  <p className="leading-snug">
                    Please confirm that you authorize <strong>MediVance Health Systems</strong> to access your <strong>{ssoModalData.provider}</strong> account email for authentication.
                  </p>
                </div>

                <label className="flex items-start gap-3 cursor-pointer group pt-1">
                  <input 
                    type="checkbox"
                    checked={ssoAgreeTerms}
                    onChange={(e) => setSsoAgreeTerms(e.target.checked)}
                    className={`mt-0.5 w-4 h-4 rounded border-slate-300 ${currentTheme.accentColor} focus:ring-2 ${currentTheme.ringAccent} transition-all`}
                  />
                  <span className="text-xs font-medium text-slate-700 group-hover:text-slate-900 leading-snug">
                    I agree to the <a href="#" className="underline font-bold text-blue-600">Terms of Service</a> & <a href="#" className="underline font-bold text-blue-600">HIPAA Privacy Policy</a> for {ssoModalData.provider} Single Sign-On.
                  </span>
                </label>

                <div className="flex gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setSsoModalData(null)}
                    className="w-1/3 py-3 rounded-xl border border-slate-200 text-slate-600 font-semibold text-xs hover:bg-slate-50 transition-colors"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    disabled={!ssoAgreeTerms}
                    onClick={confirmSsoLogin}
                    className={`w-2/3 py-3 rounded-xl text-white font-bold text-xs transition-all ${ssoAgreeTerms ? `${currentTheme.buttonGradient} shadow-md` : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}
                  >
                    Allow & Complete Sign In
                  </button>
                </div>
              </div>
            </div>
          )}

          <ForgotPasswordModal
            isOpen={isForgotPasswordOpen}
            onClose={() => setIsForgotPasswordOpen(false)}
            activeRole={role}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
<script src="chatbot-widget.js"></script>
</body>
</html>
